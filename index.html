    /* ------------------------------------------------------------------ */
    function App() {
      const [pageId, setPageId] = useState('vendor');
      const [pinned, setPinned] = useState(null);   // clicked dataset (stays active)
      const [hovered, setHovered] = useState(null);  // mouse-over dataset

      const def = PAGES.find(p => p.id === pageId);

      // Switching pages starts each page fresh.
      const selectPage = (id) => { setPageId(id); setPinned(null); setHovered(null); };

      const activeId = hovered || pinned;            // single-view dataset
      const compare = pinned && hovered && pinned !== hovered;

      // Returns the visual style for one edge given the current selection.
      const edgeStyle = (id) => {
        if (compare) {
          const inA = def.datasets[pinned].edges.includes(id);
          const inB = def.datasets[hovered].edges.includes(id);
          if (inA && inB) return { color: CMP.both, width: 4, show: true };
          if (inA)        return { color: CMP.a,    width: 4, show: true };
          if (inB)        return { color: CMP.b,    width: 4, show: true };
          return { color: '#f1f5f9', width: 2, show: false };
        }
        if (!activeId) return { color: '#cbd5e1', width: 2, show: true, def: true };
        const ds = def.datasets[activeId];
        if (ds.edges.includes(id)) {
          return { color: def.typeColor[ds.type], width: 4, show: true };
        }
        if (ds.missed && ds.missed.includes(id)) return { color: '#dc2626', width: 2, show: true, missed: true };
        return { color: '#f1f5f9', width: 2, show: false };
      };

      return (
        <div className="bg-slate-50 text-slate-800">

          {/* ============ Sticky glassmorphic navbar — pinned across the whole page ============ */}
          <div className="sticky top-0 z-50 px-4 md:px-8 pt-3 pb-3">
            {/* Progressive-blur backdrop: frosts the gap above / around the bar, then fades out
                so content below scrolls back into sharp focus (iOS-style header blur). */}
            <div aria-hidden="true"
              className="absolute inset-0 pointer-events-none backdrop-blur-lg bg-gradient-to-b from-white/70 via-white/35 to-transparent
                [mask-image:linear-gradient(to_bottom,black_55%,transparent)] [-webkit-mask-image:linear-gradient(to_bottom,black_55%,transparent)]" />

            <div className="relative flex items-center justify-center min-h-[2.75rem] px-4 py-2 rounded-2xl
              border border-white/50 bg-white/50 backdrop-blur-xl shadow-lg shadow-slate-900/5 ring-1 ring-white/60">
              <h1 className="absolute left-4 top-1/2 -translate-y-1/2 text-base md:text-xl font-bold tracking-tight text-slate-900 leading-tight max-w-[38%]">
                Pharma Data Capture Architecture
              </h1>

              {/* iOS-style frosted segmented control */}
              <div className="inline-flex rounded-full bg-white/25 border border-white/40 backdrop-blur-md p-1 gap-1
                shadow-[inset_0_1px_2px_rgba(15,23,42,0.10),0_1px_1px_rgba(255,255,255,0.7)]">
                {PAGES.map((p, i) => (
                  <button key={p.id} onClick={() => selectPage(p.id)}
                    className={`relative px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-200 ease-out
                      ${pageId === p.id
                        ? 'text-slate-900 bg-white/70 backdrop-blur-md ring-1 ring-white/80 shadow-[0_4px_12px_-2px_rgba(15,23,42,0.22),inset_0_1px_0_rgba(255,255,255,0.95)]'
                        : 'text-slate-500 hover:text-slate-800 hover:bg-white/40'}`}>
                    <span className="text-slate-400 mr-1">{i + 1}</span>{p.tab}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ============ SCREEN 1 — map + controls fill the viewport ============ */}
          <div className="h-[calc(100vh-5rem)] w-full flex flex-col px-4 md:px-8 pb-3 gap-2.5">

            {/* 1. INTERACTIVE MAP — flexes to fill the remaining viewport height while
                 keeping its 2:1 ratio so the percent-positioned nodes stay aligned
                 with the SVG edges. */}
            <div className="flex-1 min-h-0 flex items-center justify-center">
              <div className="rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative h-full max-w-full mx-auto"
                style={{
                  aspectRatio: VIEW_W + ' / ' + VIEW_H,
                  backgroundColor: '#ffffff',
                  // Subtle "diagram canvas" texture: a faint dot grid (whiteboard / blueprint feel).
                  backgroundImage: 'radial-gradient(#e2e8f0 1px, transparent 1.4px)',
                  backgroundSize: '24px 24px',
                }}>

                <svg className="absolute inset-0 w-full h-full pointer-events-none"
                  viewBox={`0 0 ${VIEW_W} ${VIEW_H}`} preserveAspectRatio="xMidYMid meet">
                  <defs>
                    {ALL_MARKERS.map(c => (
                      <marker key={c} id={markerId(c)} viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill={c} />
                      </marker>
                    ))}
                  </defs>

                  {[...def.edges]
                    .sort((a, b) => {
                      // Paint order = stacking order in SVG. Rank edges so highlighted
                      // (active) lines render last and sit on top of intersecting lines.
                      const rank = (id) => {
                        const st = edgeStyle(id);
                        if (!st.show)   return 0;   // faded background lines
                        if (st.def)     return 1;   // neutral default state
                        if (st.missed)  return 2;   // missed / blind-spot lines
                        return 3;                   // highlighted active lines — on top
                      };
                      return rank(a.id) - rank(b.id);
                    })
                    .map(edge => {
                    const s = edgeStyle(edge.id);
                    const labelStroke = s.def ? '#cbd5e1' : s.color;
                    const labelFill = s.def ? '#64748b' : s.color;
                    const arrow = (s.show && !s.missed) ? `url(#${markerId(s.color)})` : '';
                    // Neutral (nothing selected) → compact badge; highlighted → full size.
                    const lbl = s.def
                      ? { w: 56, h: 18, rx: 9,  fs: 9,  y: 3 }
                      : { w: 72, h: 24, rx: 12, fs: 11, y: 4 };

                    return (
                      <g key={edge.id}>
                        <path
                          d={edge.d} fill="none" stroke={s.color} strokeWidth={s.width}
                          strokeDasharray={s.missed ? '6,6' : 'none'}
                          markerEnd={arrow}
                          className="transition-all duration-300 ease-in-out"
                        />
                        <g transform={`translate(${edge.mx}, ${edge.my})`}
                          className={`transition-opacity duration-300 ${s.show ? 'opacity-100' : 'opacity-0'}`}>
                          {s.missed ? (
                            <g transform="translate(-12, -12)">
                              <circle cx="12" cy="12" r="13" fill="white" />
                              <XCircle className="text-red-500" size={24} />
                            </g>
                          ) : (
                            <React.Fragment>
                              <rect x={-lbl.w / 2} y={-lbl.h / 2} width={lbl.w} height={lbl.h} rx={lbl.rx} fill="white"
                                stroke={labelStroke} strokeWidth="1"
                                className="transition-all duration-300 ease-in-out" />
                              <text x="0" y={lbl.y} textAnchor="middle" fontSize={lbl.fs} fontWeight="600"
                                fill={labelFill}>{edge.label}</text>
                            </React.Fragment>
                          )}
                        </g>
                      </g>
                    );
                  })}
                </svg>

                {/* Node overlay */}
                <div className="absolute inset-0">
                  {Object.values(def.nodes).map(node => {
                    const Ico = node.icon;
                    return (
                      <div key={node.id}
                        className="absolute flex flex-col items-center -translate-x-1/2 -translate-y-1/2"
                        style={{ left: `${(node.x / VIEW_W) * 100}%`, top: `${(node.y / VIEW_H) * 100}%` }}>
                        <div className={`w-14 h-14 rounded-full flex items-center justify-center border-2 shadow-sm z-10 bg-white ${node.color} ${node.border}`}>
                          <Ico size={24} />
                        </div>
                        <span className="mt-2 text-xs font-semibold bg-white px-2 py-1 rounded-md border border-slate-200 shadow-sm whitespace-nowrap text-slate-700">
                          {node.label}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Comparison caption — shown only when comparing two datasets */}
            <div className="text-center text-sm min-h-[2rem] flex items-center justify-center gap-x-4 gap-y-1 flex-wrap shrink-0">
              {compare && (
                <React.Fragment>
                  <span className="font-semibold" style={{ color: CMP.a }}>&#9632; {def.datasets[pinned].name} only</span>
                  <span className="font-semibold" style={{ color: CMP.b }}>&#9632; {def.datasets[hovered].name} only</span>
                  <span className="font-semibold" style={{ color: CMP.both }}>&#9632; Captured by both</span>
                </React.Fragment>
              )}
            </div>

            {/* 2. BUTTON CONTROLS */}
            <div className="flex flex-col lg:flex-row justify-center items-center gap-5 lg:gap-8 shrink-0">
              {def.btnGroups.map((g, i) => {
                const cls = BTN[g.accent];
                return (
                  <React.Fragment key={g.label}>
                    {i > 0 && <div className="hidden lg:block w-px h-14 bg-slate-200" />}
                    <div className="flex flex-col items-center gap-2.5">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{g.label}</span>
                      <div className="flex gap-3 flex-wrap justify-center">
                        {g.ids.map(id => {
                          const isPinned = pinned === id;
                          const on = isPinned || hovered === id;
                          return (
                            <button key={id}
                              onClick={() => setPinned(prev => prev === id ? null : id)}
                              onMouseEnter={() => setHovered(id)}
                              onMouseLeave={() => setHovered(null)}
                              className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold border-2 transition-colors duration-150
                                ${on ? cls.on : cls.off}`}>
                              {isPinned && <Check size={15} className="-ml-0.5 shrink-0" />}
                              {def.datasets[id].name}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </React.Fragment>
                );
              })}
            </div>

            {/* Scroll cue — the dataset architecture sits below the fold */}
            <div className="shrink-0 flex flex-col items-center text-slate-400 text-xs gap-0.5">
              <span className="uppercase tracking-wider">Scroll for dataset architecture</span>
              <ChevronDown size={18} className="animate-bounce" />
            </div>
          </div>

          {/* ============ SCREEN 2 — dataset architecture (revealed on scroll) ============ */}
          <div className="w-full px-4 md:px-8 py-12 border-t border-slate-200 bg-white">
            <div className="flex items-center justify-center gap-3 text-slate-700 font-semibold mb-4">
              <Database size={20} className="text-slate-500" />
              <h2 className="text-xl">Dataset Architecture</h2>
            </div>

            <p className="text-center text-slate-500 text-sm md:text-base max-w-4xl mx-auto mb-8">{def.subtitle}</p>

            <div className="flex flex-col items-center">
              <div className="bg-slate-900 text-white px-6 py-2 rounded-full font-semibold shadow-sm z-10">
                {def.hierarchyTitle}
              </div>
              <div className="w-px h-6 bg-slate-300" />

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 w-full">
                {def.branches.map(b => <Branch key={b.title} {...b} />)}
              </div>
            </div>

            <p className="text-center text-xs text-slate-400 pt-8">
              Illustrative concept &middot; node = actor, edge = a captured interaction or relationship.
            </p>
          </div>
        </div>
      );
    }

    /* ---- small presentational helpers ---- */
    function LegendItem({ color, label, dashed }) {
      return (
        <span className="flex items-center gap-2">
          <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke={color}
            strokeWidth="3" strokeDasharray={dashed ? '4,3' : 'none'} strokeLinecap="round" /></svg>
          {label}
        </span>
      );
    }

    function Branch({ accent, title, tag, sub, chips, desc, note }) {
      const a = ACCENTS[accent];
      return (
        <div className="flex flex-col items-center px-2">
          <div className={`${a.pill} text-white px-6 py-1.5 rounded-full font-medium shadow-sm relative`}>
            {title}
            <span className="absolute -top-2 -right-2 bg-white text-[10px] font-bold uppercase tracking-wide text-slate-500 border border-slate-200 rounded-full px-2 py-0.5 shadow-sm">{tag}</span>
          </div>
          <p className="text-[10px] text-slate-400 italic mt-2 mb-4 text-center">{sub}</p>
          <div className="border border-slate-200 rounded-xl p-4 bg-slate-50 w-full flex flex-col gap-3 flex-1">
            <Chips items={chips} accent={accent} />
            <p className="text-xs text-slate-600 leading-relaxed" dangerouslySetInnerHTML={{ __html: desc }} />
            <Note tone={note.tone} items={note.items} />
          </div>
        </div>
      );
    }

    function Chips({ items, accent }) {
      const a = ACCENTS[accent];
      return (
        <div className="flex justify-center gap-2 flex-wrap">
          {items.map(it => (
            <span key={it} className={`${a.chip} px-3 py-1 rounded-full text-xs font-bold shadow-sm`}>{it}</span>
          ))}
        </div>
      );
    }

    function Note({ tone, items }) {
      return (
        <div className={`mt-auto text-[10px] border rounded-lg p-2.5 ${TONE[tone]}`}>
          {items.map((t, i) => <div key={i} dangerouslySetInnerHTML={{ __html: '&bull; ' + t }} />)}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Bootstrap: transform the JSX with the CLASSIC runtime, then run it. -->
  <script>
    (function () {
      function fail(msg) {
        document.getElementById('root').innerHTML =
          '<div style="max-width:640px;margin:80px auto;font-family:sans-serif;' +
          'background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:24px;color:#9f1239">' +
          '<b>Could not start the app.</b><br><br>' + msg + '</div>';
      }
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        return fail('React did not load. Check your internet connection (the CDN scripts may be blocked).');
      }
      if (typeof Babel === 'undefined') {
        return fail('Babel did not load. Check your internet connection.');
      }
      try {
        var src = document.getElementById('appSource').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        (0, eval)(out);
      } catch (e) {
        console.error(e);
        fail(String(e && e.message ? e.message : e));
      }
    })();
  </script>
</body>
</html>
